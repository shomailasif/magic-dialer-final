name: Generate Lockfile Artifact
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/generate-lockfile-artifact.yml"
      - ".lockfile-trigger"
      - ".lockfile-trigger-2"
      - ".lockfile-trigger-3"
      - ".lockfile-trigger-4"
permissions:
  contents: write
concurrency:
  group: lockfile-generator-main
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate clean npm lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Commit verified lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Regenerate verified npm lockfile"
          git pull --rebase origin main
          git push
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
