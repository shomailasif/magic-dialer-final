name: Agent Call Repair Diagnostics
on:
  push:
    branches: [repair/agent-call-start-merged]
permissions:
  contents: write
jobs:
  inspect-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch agent and portal call paths
        run: |
          python - <<'PY'
          from pathlib import Path
          ap=Path('src/management/agent/agent.js')
          s=ap.read_text()
          imp='const { ensurePhoneSession } = require("./call-start");'
          if imp not in s:
            marker='const { emailQualifiedLead } = require("./email");'
            s=s.replace(marker, marker+'\n'+imp, 1)
          old='''      let sessionId = null;\n      if (portal && config.token) {\n        try {\n          const active = await post(`${portal}/api/agent/active-call`, { token: config.token });\n          if (active.status === 200 && active.body) sessionId = active.body.sessionId || null;\n        } catch {}\n      }\n      if (!sessionId) throw new Error("No active phone media session found - refusing PC-microphone fallback.");'''
          new='''      const phoneSession = await ensurePhoneSession({\n        portal,\n        token: config.token,\n        callList: config.callList,\n        post,\n        log,\n      });\n      const sessionId = phoneSession.sessionId;'''
          if old not in s:
            raise SystemExit('agent call-start target block not found')
          s=s.replace(old,new,1)
          ap.write_text(s)

          sp=Path('src/management/portal/server.js')
          s=sp.read_text()
          marker='''    // --- Cloud call gateway: dialer control plane ---'''
          block='''    // Agent-only outbound dial: the customer PC starts its own cloud phone session.\n    if (url.pathname === "/api/agent/dial" && method === "POST") {\n      const body = await readBody(req);\n      const token = String(body.token || "").trim();\n      const c = token ? await getCustomerByToken(db, token) : null;\n      if (!c) return send(401, { error: "Invalid access token" });\n      try {\n        const s = await trunk.placeCall(dialCtx, { customer: c, destination: body.number });\n        return send(200, { ok: true, id: s.id, status: s.status, provider: s.provider, providerLabel: s.providerLabel, destination: s.destination, mediaPath: s.mediaPath, error: s.error || null });\n      } catch (e) {\n        const code = e.code === "BAD_NUMBER" || e.code === "NO_DIALER" ? 400 : 500;\n        return send(code, { error: e.message });\n      }\n    }\n\n    // Agent-only status: token ownership is checked before exposing session state.\n    if (url.pathname === "/api/agent/dial-status" && method === "POST") {\n      const body = await readBody(req);\n      const token = String(body.token || "").trim();\n      const c = token ? await getCustomerByToken(db, token) : null;\n      if (!c) return send(401, { error: "Invalid access token" });\n      const sessionId = String(body.sessionId || "").trim();\n      if (!sessionId) return send(400, { error: "Missing session id" });\n      const s = trunk.getSessionsFor(gatewayCtx.portalId).find((x) => x && x.id === sessionId);\n      if (!s) return send(404, { error: "Call session not found" });\n      if (s.token !== token) return send(403, { error: "You can only read your own call session" });\n      return send(200, { ok: true, id: s.id, status: s.status, provider: s.provider, providerLabel: s.providerLabel, destination: s.destination, startedAt: s.startedAt, mediaPath: s.mediaPath, mediaActive: !!s.mediaActive, mediaBytesIn: s.mediaBytesIn || 0, mediaBytesOut: s.mediaBytesOut || 0, error: s.error || null });\n    }\n\n'''
          if '/api/agent/dial' not in s:
            if marker not in s: raise SystemExit('portal insertion marker not found')
            s=s.replace(marker, block+marker, 1)
          sp.write_text(s)
          print('agent wired; portal routes wired')
          PY
      - name: Validate and run focused tests
        run: |
          node --check src/management/agent/agent.js
          node --check src/management/agent/call-start.js
          node --check src/management/portal/server.js
          node -e "const m=require('./src/management/agent/call-start'); if(typeof m.ensurePhoneSession!=='function') process.exit(1); console.log('call-start export OK')"
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/management/agent/agent.js src/management/portal/server.js
          if git diff --cached --quiet; then echo "No source changes"; else git commit -m "Wire cloud agent dialing and session status" && git push; fi
