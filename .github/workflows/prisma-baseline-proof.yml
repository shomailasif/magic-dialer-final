name: Prisma Baseline Proof
on:
  pull_request:
    branches: ["main"]
    paths:
      - "prisma/**"
      - "package.json"
      - "scripts/production-db-bootstrap.cjs"
      - ".github/workflows/prisma-baseline-proof.yml"
  workflow_dispatch: {}

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies deterministically
        run: npm ci
      - name: Verify immutable baseline and forward migrations exist
        shell: bash
        run: |
          set -euo pipefail
          test -s prisma/migrations/0_init/migration.sql
          test -s prisma/migrations/20260920_ai_quota/migration.sql
      - name: Prove fresh database deployment
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="file:$RUNNER_TEMP/fresh.db"
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Prove exact legacy production adoption path preserves data
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="file:$RUNNER_TEMP/existing.db"
          sqlite3 "$RUNNER_TEMP/existing.db" < prisma/migrations/0_init/migration.sql
          sqlite3 "$RUNNER_TEMP/existing.db" "INSERT INTO User (id,email,passwordHash,role,createdAt,updatedAt) VALUES ('baseline-sentinel','baseline@example.invalid','sentinel','BUSINESS_ADMIN',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP);"
          sqlite3 "$RUNNER_TEMP/existing.db" "INSERT INTO CallCampaign (id,userId,name,status,startedAt,callsMade) VALUES ('campaign-sentinel','baseline-sentinel','Preserve Me','RUNNING',CURRENT_TIMESTAMP,7);"
          DATA_BEFORE=$(sqlite3 "$RUNNER_TEMP/existing.db" "SELECT id || '|' || email || '|' || passwordHash FROM User WHERE id='baseline-sentinel';")
          CAMPAIGN_BEFORE=$(sqlite3 "$RUNNER_TEMP/existing.db" "SELECT id || '|' || userId || '|' || name || '|' || callsMade FROM CallCampaign WHERE id='campaign-sentinel';")
          node scripts/production-db-bootstrap.cjs
          DATA_AFTER=$(sqlite3 "$RUNNER_TEMP/existing.db" "SELECT id || '|' || email || '|' || passwordHash FROM User WHERE id='baseline-sentinel';")
          test "$DATA_BEFORE" = "$DATA_AFTER"
          test "$DATA_AFTER" = "baseline-sentinel|baseline@example.invalid|sentinel"
          CAMPAIGN_AFTER=$(sqlite3 "$RUNNER_TEMP/existing.db" "SELECT id || '|' || userId || '|' || name || '|' || callsMade FROM CallCampaign WHERE id='campaign-sentinel';")
          test "$CAMPAIGN_BEFORE" = "$CAMPAIGN_AFTER"
          test "$CAMPAIGN_AFTER" = "campaign-sentinel|baseline-sentinel|Preserve Me|7"
          test -z "$(sqlite3 "$RUNNER_TEMP/existing.db" "PRAGMA foreign_key_check;")"
          test "$(sqlite3 "$RUNNER_TEMP/existing.db" "SELECT COUNT(*) FROM pragma_foreign_key_list('CallCampaign') WHERE \"from\" IN ('strategyId','experimentId');")" -eq 2
          sqlite3 "$RUNNER_TEMP/existing.db" "SELECT executionKey FROM Call LIMIT 0;"
          sqlite3 "$RUNNER_TEMP/existing.db" "SELECT followUpAttemptsMade,consentSource,consentUpdatedAt FROM Lead LIMIT 0;"
          sqlite3 "$RUNNER_TEMP/existing.db" "SELECT sourceCallId FROM StrategyLearningEvent LIMIT 0;"
          sqlite3 "$RUNNER_TEMP/existing.db" "SELECT normalizedPhone FROM PhoneSuppression LIMIT 0;"
          MIGRATIONS_ON_DISK=$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)
          MIGRATIONS_APPLIED=$(sqlite3 "$RUNNER_TEMP/existing.db" "SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL;")
          test "$MIGRATIONS_APPLIED" -eq "$MIGRATIONS_ON_DISK"
          npx prisma migrate status
      - name: Prove bootstrap is idempotent after adoption
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="file:$RUNNER_TEMP/existing.db"
          BEFORE=$(sqlite3 "$RUNNER_TEMP/existing.db" "SELECT COUNT(*) FROM _prisma_migrations;")
          node scripts/production-db-bootstrap.cjs
          AFTER=$(sqlite3 "$RUNNER_TEMP/existing.db" "SELECT COUNT(*) FROM _prisma_migrations;")
          test "$BEFORE" -eq "$AFTER"
          npx prisma migrate status
      - name: Upload verified committed baseline migration
        uses: actions/upload-artifact@v4
        with:
          name: prisma-0-init
          path: prisma/migrations/0_init/migration.sql
          if-no-files-found: error
