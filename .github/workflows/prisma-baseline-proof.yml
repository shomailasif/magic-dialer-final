name: Prisma Baseline Proof
on:
  pull_request:
    branches: ["main"]
    paths:
      - "prisma/**"
      - "package.json"\n      - "scripts/production-start.js"
      - ".github/workflows/prisma-baseline-proof.yml"
  workflow_dispatch: {}

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies deterministically
        run: npm ci
      - name: Verify immutable baseline and forward migrations exist
        shell: bash
        run: |
          set -euo pipefail
          test -s prisma/migrations/0_init/migration.sql
          test -s prisma/migrations/20260920_ai_quota/migration.sql
      - name: Prove fresh database deployment
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="file:$RUNNER_TEMP/fresh.db"
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Prove real legacy production adoption and data preservation
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="file:$RUNNER_TEMP/existing.db"
          sqlite3 "$RUNNER_TEMP/existing.db" < prisma/migrations/0_init/migration.sql
          sqlite3 "$RUNNER_TEMP/existing.db" "INSERT INTO User (id,email,passwordHash,role,createdAt,updatedAt) VALUES ('baseline-sentinel','baseline@example.invalid','sentinel','BUSINESS_ADMIN',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP);"
          node scripts/production-start.js --migrate-only
          npx prisma migrate status
          DATA_AFTER=$(sqlite3 "$RUNNER_TEMP/existing.db" "SELECT id || '|' || email || '|' || passwordHash FROM User WHERE id='baseline-sentinel';")
          test "$DATA_AFTER" = "baseline-sentinel|baseline@example.invalid|sentinel"
          sqlite3 "$RUNNER_TEMP/existing.db" "SELECT executionKey FROM Call LIMIT 0;"
          sqlite3 "$RUNNER_TEMP/existing.db" "SELECT consentSource,consentUpdatedAt,followUpAttemptsMade FROM Lead LIMIT 0;"
          sqlite3 "$RUNNER_TEMP/existing.db" "SELECT sourceCallId FROM StrategyLearningEvent LIMIT 0;"
          sqlite3 "$RUNNER_TEMP/existing.db" "SELECT name FROM sqlite_schema WHERE type='index' AND name='Call_executionKey_key';" | grep -q Call_executionKey_key
      - name: Prove partial legacy migration fails closed
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="file:$RUNNER_TEMP/partial.db"
          sqlite3 "$RUNNER_TEMP/partial.db" < prisma/migrations/0_init/migration.sql
          sqlite3 "$RUNNER_TEMP/partial.db" 'ALTER TABLE "Call" ADD COLUMN "executionKey" TEXT;'
          if node scripts/production-start.js --migrate-only; then
            echo "partial migration was incorrectly accepted" >&2
            exit 1
          fi
          sqlite3 "$RUNNER_TEMP/partial.db" "SELECT executionKey FROM Call LIMIT 0;"
      - name: Upload verified committed baseline migration
        uses: actions/upload-artifact@v4
        with:
          name: prisma-0-init
          path: prisma/migrations/0_init/migration.sql
          if-no-files-found: error
