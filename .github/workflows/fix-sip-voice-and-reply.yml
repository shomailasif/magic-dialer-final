name: Fix SIP voice and reply
on:
  push:
    paths:
      - '.github/workflows/fix-sip-voice-and-reply.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove actual remaining double resample
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/sip-conversation.ts')
          s=p.read_text()
          old='''          pcm = antiAliasLowPass(pcm, ratio) as Int16Array<ArrayBuffer>;\n          const outLen = Math.ceil(pcm.length / ratio);\n          const out = new Int16Array(outLen);\n          for (let i = 0; i < outLen; i++) out[i] = pcm[i * ratio] || 0;\n          pcm = out;'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exact remaining decoder block once, found {s.count(old)}')
          s=s.replace(old, '          pcm = antiAliasLowPass(pcm, ratio) as Int16Array<ArrayBuffer>;', 1)
          p.write_text(s)
          PY
          git config user.name "shomailasif"
          git config user.email "shomailasif@gmail.com"
          git add src/lib/sip-conversation.ts
          git commit -m "Fix actual Edge TTS double resampling"
          git push
