# Keep the Supabase free-tier database out of the inactivity pause.
#
# WHY A SQL QUERY AND NOT A HEALTH PING
#
# Supabase pauses free projects after 7 days of low *database* activity. A 200
# from an API gateway does not count: /auth/v1/health is answered by the auth
# service at the edge of the stack and never issues a query against Postgres,
# so a daily ping to it stays green forever while the database sleeps. A status
# code says a request was answered and nothing about what work it caused.
#
# scripts/supabase-keepalive.cjs connects to Postgres, runs a real count(*)
# against "Lead", and upserts a one-row heartbeat. It exits non-zero if the
# query did not return a row count, so a green run here means SQL executed -
# not merely that something responded.
#
# WHEN THIS IS THE WRONG FIX
#
# This is a stopgap, not the root cause. The site normally writes to this
# database on every heartbeat; when Suga suspended the deployment the site went
# to HTTP 404, the writes stopped, and Supabase started its pause clock. Restoring
# the deployment makes this workflow unnecessary, and upgrading Supabase to Pro
# ($25/mo) removes pausing permanently. Until either happens, this holds the line.
#
# CAVEAT WORTH KNOWING
#
# GitHub disables scheduled workflows on public repositories after 60 days with
# no repository activity, silently. If this stops firing the database pauses
# again with no failed run to notice. Check the Actions tab if the warning
# email returns; the local scheduled task "MagicDialer Supabase Keepalive" is a
# second, independent trigger for exactly that reason.
name: Supabase Keepalive

on:
  schedule:
    # Once a day. Supabase's window is 7 days, so a week of failed runs still
    # leaves time to notice - but check it rather than assuming it ran.
    - cron: "23 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only the driver. The full install would run prisma generate and the
      # whole dependency tree to send one query.
      - name: Install the postgres driver
        run: npm install pg@8 --no-save --no-package-lock --silent

      - name: Execute a real query against the database
        env:
          KEEPALIVE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/supabase-keepalive.cjs
