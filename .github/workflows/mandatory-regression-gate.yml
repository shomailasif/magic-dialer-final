name: Mandatory Regression Gate
on:
  push:
    branches: ["main"]
    paths:
      - "src/management/**"
      - "src/app/api/engine/**"
      - "src/app/api/heartbeat/**"
      - "src/app/api/dialer/**"
      - "src/app/**/dialer/**"
      - "src/app/api/auth/**"
      - "src/app/**/dashboard/test-call-card.tsx"
      - "src/app/**/dashboard/runtime-readiness-card.tsx"
      - "src/app/**/dashboard/page.tsx"
      - "src/lib/auth.ts"
      - "prisma/schema.prisma"
      - ".github/workflows/mandatory-regression-gate.yml"
      - ".github/workflows/build-windows-engine.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/management/**"
      - "src/app/api/engine/**"
      - "src/app/api/heartbeat/**"
      - "src/app/api/dialer/**"
      - "src/app/**/dialer/**"
      - "src/app/api/auth/**"
      - "src/app/**/dashboard/test-call-card.tsx"
      - "src/app/**/dashboard/runtime-readiness-card.tsx"
      - "src/app/**/dashboard/page.tsx"
      - "src/lib/auth.ts"
      - "prisma/schema.prisma"
      - ".github/workflows/mandatory-regression-gate.yml"
      - ".github/workflows/build-windows-engine.yml"
  workflow_dispatch: {}

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install management dependencies
        working-directory: src/management
        run: npm install
      - name: Install application dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type-check application and enrollment APIs
        run: npx tsc --noEmit
      - name: Run complete regression suite
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File src/management/build/run-all-tests.ps1
