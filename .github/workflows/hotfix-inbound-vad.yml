name: Inbound speech detection hotfix
on:
  push:
    paths:
      - '.github/workflows/hotfix-inbound-vad.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch active listener safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/lib/sip-conversation.ts')
          s=p.read_text()
          start=s.index('    const on = (d: any) => {', s.index('function listenForSpeech'))
          end=s.index('    };', start)+6
          new='''    const on = (d: any) => {
      const rawPayload = d?.payload || d;
      const payload = Buffer.isBuffer(rawPayload)
        ? rawPayload
        : (rawPayload && typeof rawPayload.length === "number" ? Buffer.from(rawPayload) : null);
      if (!payload || !payload.length) return;
      let sum = 0;
      let peak = 0;
      for (let i = 0; i < payload.length; i++) {
        const a = Math.abs(ulawDecode(payload[i]));
        sum += a;
        if (a > peak) peak = a;
      }
      const avg = sum / payload.length;
      const voice = peak >= 1200 && avg >= 180;
      const now = Date.now();
      if (voice) {
        heardRef.current = true;
        if (!got) first = now;
        got = true;
        last = now;
      }
      if (got) audioChunks.push(payload);
    };'''
          s=s[:start]+new+s[end:]
          old='''      if (got && Date.now() - last > 1000) { finish(); return; }
      if (!got && Date.now() - start > maxMs) { finish(); return; }'''
          new2='''      if (got && Date.now() - last > 700) { finish(); return; }
      if (got && first && Date.now() - first > 8000) { finish(); return; }
      if (!got && Date.now() - start > maxMs) { finish(); return; }'''
          if old not in s: raise SystemExit('listen timer block not found')
          s=s.replace(old,new2,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "wodozone-hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/sip-conversation.ts
          git commit -m "Fix inbound speech detection and response handoff"
          git push origin HEAD:main
