name: Deploy immediate greeting

on:
  push:
    paths:
      - '.github/workflows/hotfix-inbound-vad.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pre-generate greeting while SIP call connects
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/lib/sip-conversation.ts')
          s=p.read_text()
          old='''  const call = await sipCallBridge(sipConfig);
          if (!call.ok) {'''
          new='''  // Start dialing and TTS at the same time. The greeting is ready when the prospect answers.
          const greeting = getInitialGreeting(state);
          const greetingFramesPromise = textToFramesLocal(greeting);
          const callPromise = sipCallBridge(sipConfig);
          const [call, greetingFrames] = await Promise.all([callPromise, greetingFramesPromise]);
          if (!call.ok) {'''
          if old not in s: raise SystemExit('call anchor missing')
          s=s.replace(old,new,1)
          old2='''  // Speak greeting immediately
          const greeting = getInitialGreeting(state);
          lines.push(`Agent: ${greeting}`);
          await speak(cs, greeting, heardRef);'''
          new2='''  // Greeting TTS was generated during ringing; start playback immediately on answer.
          lines.push(`Agent: ${greeting}`);
          if (greetingFrames && greetingFrames.length && !cs.disposed) {
            const greetingAudio = Buffer.concat(greetingFrames);
            console.log("[sip-conv] pre-generated greeting ready:", greetingAudio.length, "bytes");
            enqueueAudio(greetingAudio);
            await waitForQueue();
          } else {
            console.error("[sip-conv] pre-generated greeting unavailable; using normal TTS path");
            await speak(cs, greeting, heardRef);
          }'''
          if old2 not in s: raise SystemExit('greeting anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          grep -q "const greetingFramesPromise = textToFramesLocal(greeting)" src/lib/sip-conversation.ts
          grep -q "Promise.all(\[callPromise, greetingFramesPromise\])" src/lib/sip-conversation.ts
          grep -q "pre-generated greeting ready" src/lib/sip-conversation.ts
      - name: Commit immediate greeting fix
        run: |
          git config user.name wodozone-hotfix
          git config user.email actions@users.noreply.github.com
          git add src/lib/sip-conversation.ts
          git diff --cached --quiet && exit 1
          git commit -m "Pre-generate greeting while call is ringing"
          git push origin HEAD:main
