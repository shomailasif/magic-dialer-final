name: Repair inbound audio
on:
  push:
    paths:
      - '.github/workflows/hotfix-inbound-vad.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore proven RingCentral audioPacket path and keep VAD
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/sip-conversation.ts')
          s = p.read_text()
          start = s.index('    const on = (audio: any) => {', s.index('function listenForSpeech'))
          end = s.index('  };', start) + 4
          new = '''    const on = (d: any) => {
              const rawPayload = d?.payload || d;
              const payload = Buffer.isBuffer(rawPayload) ? rawPayload : (rawPayload && typeof rawPayload.length === "number" ? Buffer.from(rawPayload) : null);
              if (!payload || !payload.length) return;
              let sum = 0, peak = 0;
              for (let i = 0; i < payload.length; i++) {
                const amp = Math.abs(ulawDecode(payload[i]));
                sum += amp;
                if (amp > peak) peak = amp;
              }
              const now = Date.now();
              const voice = peak >= 900 && (sum / payload.length) >= 120;
              if (voice) {
                heardRef.current = true;
                if (!got) first = now;
                got = true;
                last = now;
              }
              if (got) audioChunks.push(payload);
            };'''
          s = s[:start] + new + s[end:]
          s = s.replace('cs.on("audio", on);', 'cs.on("audioPacket", on);', 1)
          s = s.replace('cs.removeListener("audio", on);', 'cs.removeListener("audioPacket", on);', 1)
          p.write_text(s)
      - name: Commit source repair
        run: |
          git config user.name wodozone-hotfix
          git config user.email actions@users.noreply.github.com
          git add src/lib/sip-conversation.ts
          git commit -m "Restore proven inbound audioPacket path with VAD"
          git push origin HEAD:main
