name: Build Windows Engine
# CI rerun marker: fresh runner after 6617c5d upgrade-step hang
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "src/management/agent/**"
      - "src/management/build/**"
      - "src/management/package.json"
      - ".github/workflows/build-windows-engine.yml"
  push:
    branches: ["main"]
    paths:
      - "src/management/agent/**"
      - "src/management/build/**"
      - "src/management/package.json"
      - ".github/workflows/build-windows-engine.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install packaging tools
        run: npm install --no-save esbuild @yao-pkg/pkg
      - name: Bundle engine
        run: node build/bundle.js
      - name: Package engine
        shell: powershell
        run: npx pkg build/dist/agent-bundle.js --targets node22-win-x64 --output build/dist/agent.exe
      - name: Build private TTS runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Join-Path $PWD "build\\dist\\runtime\\python"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "python-3.12.10-embed-amd64.zip"
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $runtime -Force
          $pth = Join-Path $runtime "python312._pth"
          $lines = Get-Content -LiteralPath $pth | Where-Object { $_ -notmatch '^#?import site$' }
          @($lines + "Lib/site-packages" + "import site") | Set-Content -LiteralPath $pth -Encoding ASCII
          $site = Join-Path $runtime "Lib\\site-packages"
          New-Item -ItemType Directory -Force -Path $site | Out-Null
          python -m pip install --disable-pip-version-check --no-compile --target $site "edge-tts==7.2.3" "imageio-ffmpeg==0.6.0"
          & (Join-Path $runtime "python.exe") -c "import edge_tts,imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          if ($LASTEXITCODE -ne 0) { throw "Private TTS runtime import proof failed" }
      - name: Compile launcher
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build/compile-launcher.ps1
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss'
      - name: Silent installer smoke test
        timeout-minutes: 3
        shell: powershell
        run: |
          $installer = Join-Path $PWD "build\\dist\\magic-dialer-engine-windows.exe"
          Write-Host "SMOKE MARKER A: starting silent installer"
          $setupLog = Join-Path $env:RUNNER_TEMP "magic-dialer-smoke-setup.log"
          $setup = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART",("/LOG=`"$setupLog`"") -PassThru
          if (-not $setup.WaitForExit(90000)) {
            Write-Host "SMOKE DIAGNOSTIC: setup did not exit within 90 seconds"
            Get-CimInstance Win32_Process | Where-Object { $_.Name -in @("magic-dialer-engine-windows.exe","MagicDialer.exe","agent.exe","cmd.exe") } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List
            if (Test-Path $setupLog) {
              Write-Host "=== INNO SETUP LOG TAIL ==="
              Get-Content -LiteralPath $setupLog -Tail 120
            }
            Stop-Process -Id $setup.Id -Force -ErrorAction SilentlyContinue
            throw "Silent installer did not return within diagnostic bound"
          }
          if ($setup.ExitCode -ne 0) { throw "Silent installer exited with code $($setup.ExitCode)" }
          Write-Host "SMOKE MARKER B: silent installer returned"
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA "Magic Dialer"))) { throw "Installer did not create application directory" }
          $app = Join-Path $env:LOCALAPPDATA "Magic Dialer"
          $privatePython = Join-Path $app "runtime\\python\\python.exe"
          if (-not (Test-Path $privatePython)) { throw "Installer missing private Python TTS runtime" }
          $ttsMp3 = Join-Path $env:RUNNER_TEMP "magic-dialer-private-tts.mp3"
          $ttsRaw = Join-Path $env:RUNNER_TEMP "magic-dialer-private-tts.raw"
          & $privatePython -m edge_tts --voice en-US-AvaNeural --text "Magic Dialer audio proof" --write-media $ttsMp3
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $ttsMp3) -or (Get-Item $ttsMp3).Length -lt 100) { throw "Private edge-tts synthesis failed" }
          $privateFfmpeg = (& $privatePython -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())").Trim()
          if (-not (Test-Path $privateFfmpeg)) { throw "Private FFmpeg binary unavailable" }
          & $privateFfmpeg -loglevel error -i $ttsMp3 -ar 8000 -ac 1 -f mulaw -y $ttsRaw
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $ttsRaw) -or (Get-Item $ttsRaw).Length -lt 100) { throw "Private TTS PCMU/8000 conversion failed" }
          Write-Host "SELF-CONTAINED TTS: edge-tts -> PCMU/8000 PASS"
          $app = Join-Path $env:LOCALAPPDATA "Magic Dialer"
          foreach ($file in @("agent.exe","MagicDialer.exe","logo.ico")) {
            if (-not (Test-Path (Join-Path $app $file))) { throw "Missing installed $file" }
          }
          $runKey = Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "Magic Dialer" -ErrorAction SilentlyContinue
          if (-not $runKey -or -not ($runKey."Magic Dialer" -like "*MagicDialer.exe*")) { throw "Missing HKCU Run auto-start entry" }
          $launcher = Join-Path $app "MagicDialer.exe"
          Write-Host "SMOKE MARKER C: starting launcher verification"
          $proc = Start-Process -FilePath $launcher -ArgumentList "--no-browser" -PassThru -WindowStyle Hidden
          Write-Host "SMOKE MARKER D: launcher process created"
          try {
            $healthy = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18787/health" -TimeoutSec 1
                $customerHealth = Invoke-RestMethod -Uri "http://127.0.0.1:48771/api/health" -TimeoutSec 1
                if ($health.ok -eq $true -and $health.service -eq "magic-dialer-engine" -and $customerHealth.ok -eq $true) { $healthy = $true; break }
              } catch {}
            }
            if ($healthy -and $health.version -ne "1.4.12") { throw "Installed engine health reported wrong version: $($health.version)" }
          if (-not $healthy) {
              if ($proc.HasExited) { Write-Host "LAUNCHER EXIT CODE: $($proc.ExitCode)" }
              Write-Host "AGENT PROCESSES:"
              Get-CimInstance Win32_Process -Filter "Name='agent.exe'" -ErrorAction SilentlyContinue | Select-Object ProcessId,ParentProcessId,CommandLine | Format-List
              Write-Host "WATCHDOG TCP LISTENERS:"
              Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.OwningProcess -in @((Get-Process agent -ErrorAction SilentlyContinue).Id) } | Select-Object LocalAddress,LocalPort,OwningProcess | Format-List
              Write-Host "ALL CHILD PROCESSES OF WATCHDOG:"
              $agents = Get-CimInstance Win32_Process -Filter "Name='agent.exe'" -ErrorAction SilentlyContinue
              foreach ($a in $agents) { Get-CimInstance Win32_Process -Filter "ParentProcessId=$($a.ProcessId)" -ErrorAction SilentlyContinue | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List }
              $childLog = Join-Path $env:LOCALAPPDATA "Magic Dialer\watchdog-child.log"
              if (Test-Path $childLog) { Write-Host "WATCHDOG CHILD LOG:"; Get-Content $childLog -Tail 200 }
              $lock = Join-Path $env:LOCALAPPDATA "Magic Dialer\watchdog.lock"
              if (Test-Path $lock) { Write-Host "WATCHDOG LOCK:"; Get-Content $lock }
              throw "Installed customer launcher did not produce complete readiness on localhost:18787 and localhost:48771"
            }
          } finally {
            Get-Process agent -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          $uninstaller = Join-Path $app "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Missing uninstaller" }
          Write-Host "SMOKE MARKER E: starting silent uninstaller"
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Write-Host "SMOKE MARKER F: silent uninstaller returned"
          $seed = Join-Path $env:LOCALAPPDATA "Magic Dialer\\updates\\known-good-1.4.12.exe"
          if (-not (Test-Path $seed)) { throw "Missing seeded known-good rollback installer" }
          if ((Get-Item $seed).Length -lt 1000000) { throw "Seeded rollback installer is unexpectedly small" }
          $seedHash = (Get-FileHash -Algorithm SHA256 $seed).Hash
          $installerHash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($seedHash -ne $installerHash) { throw "Seeded rollback installer differs from installed release bytes" }
          Write-Host "Rollback seed verified byte-for-byte: $seedHash"
          if (Test-Path (Join-Path $app "agent.exe")) { throw "Engine remained after uninstall" }
      - name: Reopen launcher while engine is already running
        timeout-minutes: 3
        shell: powershell
        run: |
          $installer = Join-Path $PWD "build\\dist\\magic-dialer-engine-windows.exe"
          $app = Join-Path $env:LOCALAPPDATA "Magic Dialer"
          # Previous smoke intentionally uninstalls. Install a fresh copy for this independent gate.
          Write-Host "REOPEN MARKER A: starting silent installer"
          $setupLog = Join-Path $env:RUNNER_TEMP "magic-dialer-reopen-setup.log"
          $setup = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART",("/LOG=`"$setupLog`"") -PassThru
          if (-not $setup.WaitForExit(90000)) {
            Write-Host "REOPEN DIAGNOSTIC: setup did not exit within 90 seconds"
            Get-CimInstance Win32_Process | Where-Object { $_.Name -in @("magic-dialer-engine-windows.exe","MagicDialer.exe","agent.exe","cmd.exe") } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List
            if (Test-Path $setupLog) { Write-Host "=== REOPEN INNO LOG TAIL ==="; Get-Content -LiteralPath $setupLog -Tail 120 }
            Stop-Process -Id $setup.Id -Force -ErrorAction SilentlyContinue
            throw "Reopen setup installer did not return within diagnostic bound"
          }
          if ($setup.ExitCode -ne 0) { throw "Reopen setup installer exited with code $($setup.ExitCode)" }
          Write-Host "REOPEN MARKER B: silent installer returned"
          $launcher = Join-Path $app "MagicDialer.exe"
          if (-not (Test-Path $launcher)) { throw "Launcher missing before duplicate-launch gate" }
          Write-Host "REOPEN MARKER C: starting first launcher"
          Start-Process -FilePath $launcher -ArgumentList "--no-browser" -WindowStyle Hidden
          Write-Host "REOPEN MARKER D: first launcher started"
          $healthy = $false
          for ($i=0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $h = Invoke-RestMethod -Uri "http://127.0.0.1:18787/health" -TimeoutSec 1
              $customerHealth = Invoke-RestMethod -Uri "http://127.0.0.1:48771/api/health" -TimeoutSec 1
              if ($h.ok -eq $true -and $customerHealth.ok -eq $true) { $healthy = $true; break }
            } catch {}
          }
          if (-not $healthy) {
            Write-Host "REOPEN DIAGNOSTIC: complete readiness failed"
            foreach ($uri in @("http://127.0.0.1:18787/health","http://127.0.0.1:48771/api/health")) {
              try { Write-Host "$uri => $((Invoke-RestMethod -Uri $uri -TimeoutSec 2 | ConvertTo-Json -Compress))" } catch { Write-Host "$uri => ERROR: $($_.Exception.Message)" }
            }
            Get-CimInstance Win32_Process | Where-Object { $_.Name -in @("MagicDialer.exe","agent.exe","cmd.exe","node.exe") } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List
            $childLog = Join-Path $app "watchdog-child.log"
            if (Test-Path $childLog) { Write-Host "=== REOPEN WATCHDOG LOG TAIL ==="; Get-Content -LiteralPath $childLog -Tail 200 }
            $lock = Join-Path $app "watchdog.lock"
            if (Test-Path $lock) { Write-Host "REOPEN WATCHDOG LOCK:"; Get-Content -LiteralPath $lock }
            throw "Complete local engine was not ready before duplicate-launch gate"
          }
          Write-Host "REOPEN MARKER E: engine healthy"
          $before = @(Get-Process agent -ErrorAction SilentlyContinue).Count
          Write-Host "REOPEN MARKER F: starting duplicate launcher"
          $p = Start-Process -FilePath $launcher -ArgumentList "--no-browser" -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(5000)) { throw "Duplicate launcher did not exit cleanly" }
          if ($p.ExitCode -ne 0) { throw "Duplicate launcher failed with exit code $($p.ExitCode)" }
          Start-Sleep -Milliseconds 500
          $after = @(Get-Process agent -ErrorAction SilentlyContinue).Count
          if ($after -ne $before) { throw "Duplicate launcher changed agent process count: $before -> $after" }
          Get-Process agent -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Exact customer reopen with packaged agent file locked
        timeout-minutes: 3
        shell: powershell
        run: |
          $installer = Join-Path $PWD "build\\dist\\magic-dialer-engine-windows.exe"
          $app = Join-Path $env:LOCALAPPDATA "Magic Dialer"
          Write-Host "EXACT REOPEN MARKER A: starting silent installer"
          $setupLog = Join-Path $env:RUNNER_TEMP "magic-dialer-exact-reopen-setup.log"
          $setup = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART",("/LOG=`"$setupLog`"") -PassThru
          if (-not $setup.WaitForExit(90000)) {
            Write-Host "EXACT REOPEN DIAGNOSTIC: setup did not exit within 90 seconds"
            Get-CimInstance Win32_Process | Where-Object { $_.Name -in @("magic-dialer-engine-windows.exe","MagicDialer.exe","agent.exe","cmd.exe") } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List
            if (Test-Path $setupLog) { Write-Host "=== EXACT REOPEN INNO LOG TAIL ==="; Get-Content -LiteralPath $setupLog -Tail 120 }
            Stop-Process -Id $setup.Id -Force -ErrorAction SilentlyContinue
            throw "Exact reopen setup installer did not return within diagnostic bound"
          }
          if ($setup.ExitCode -ne 0) { throw "Exact reopen setup installer exited with code $($setup.ExitCode)" }
          Write-Host "EXACT REOPEN MARKER B: silent installer returned"
          $launcher = Join-Path $app "MagicDialer.exe"
          Start-Process -FilePath $launcher -ArgumentList "--no-browser" -WindowStyle Hidden
          $healthy = $false
          for ($i=0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $h = Invoke-RestMethod "http://127.0.0.1:18787/health" -TimeoutSec 1
              $customerHealth = Invoke-RestMethod "http://127.0.0.1:48771/api/health" -TimeoutSec 1
              if ($h.service -eq "magic-dialer-engine" -and $customerHealth.ok -eq $true) { $healthy = $true; break }
            } catch {}
          }
          if (-not $healthy) { throw "Complete local engine not ready before exact reopen gate" }
          $before = @(Get-Process agent -ErrorAction SilentlyContinue).Count
          $p = Start-Process -FilePath $launcher -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(5000)) { throw "Launcher did not exit while engine already healthy" }
          if ($p.ExitCode -ne 0) { throw "Launcher reproduced customer file-lock failure: exit $($p.ExitCode)" }
          $after = @(Get-Process agent -ErrorAction SilentlyContinue).Count
          if ($after -ne $before) { throw "Launcher executed another agent despite healthy local engine" }
          Get-Process agent -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      # Fresh-run trigger: rerun bounded in-place upgrade gate after runner-side hang; no behavior change.
      - name: In-place upgrade with running old engine
        timeout-minutes: 3
        shell: powershell
        run: |
          $installer = Join-Path $PWD "build\\dist\\magic-dialer-engine-windows.exe"
          $app = Join-Path $env:LOCALAPPDATA "Magic Dialer"
          # Reinstall once, start the real launcher/watchdog, then install over the running copy.
          Write-Host "UPGRADE MARKER A: starting preparation installer"
          $prepLog = Join-Path $env:RUNNER_TEMP "magic-dialer-upgrade-prep.log"
          $prep = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART",("/LOG=`"$prepLog`"") -PassThru
          if (-not $prep.WaitForExit(90000)) {
            Write-Host "UPGRADE DIAGNOSTIC: preparation installer did not exit"
            Get-CimInstance Win32_Process | Where-Object { $_.Name -in @("magic-dialer-engine-windows.exe","MagicDialer.exe","agent.exe","cmd.exe") } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List
            if (Test-Path $prepLog) { Write-Host "=== PREPARATION INNO LOG TAIL ==="; Get-Content -LiteralPath $prepLog -Tail 120 }
            Stop-Process -Id $prep.Id -Force -ErrorAction SilentlyContinue
            throw "Preparation installer exceeded 90-second diagnostic bound"
          }
          if ($prep.ExitCode -ne 0) { throw "Preparation installer exited with code $($prep.ExitCode)" }
          Write-Host "UPGRADE MARKER B: preparation installer returned"
          $launcher = Join-Path $app "MagicDialer.exe"
          Write-Host "UPGRADE MARKER C: starting pre-upgrade launcher"
          Start-Process -FilePath $launcher -ArgumentList "--no-browser" -WindowStyle Hidden
          $oldPid = $null
          for ($i=0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 300
            $a = Get-Process agent -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($a) { $oldPid = $a.Id; break }
          }
          if (-not $oldPid) { throw "Pre-upgrade engine did not start" }
          Write-Host "UPGRADE MARKER D: pre-upgrade agent running PID $oldPid"
          $upgradeLog = Join-Path $env:RUNNER_TEMP "magic-dialer-in-place-upgrade.log"
          Write-Host "UPGRADE MARKER E: starting in-place installer"
          $upgrade = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART",("/LOG=`"$upgradeLog`"") -PassThru
          if (-not $upgrade.WaitForExit(90000)) {
            Write-Host "UPGRADE DIAGNOSTIC: in-place installer did not exit"
            Get-CimInstance Win32_Process | Where-Object { $_.Name -in @("magic-dialer-engine-windows.exe","MagicDialer.exe","agent.exe","cmd.exe") } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List
            if (Test-Path $upgradeLog) { Write-Host "=== IN-PLACE INNO LOG TAIL ==="; Get-Content -LiteralPath $upgradeLog -Tail 120 }
            try { $upgrade.Kill() } catch {}
            throw "In-place upgrade installer exceeded 90-second hard timeout"
          }
          if ($upgrade.ExitCode -ne 0) { throw "In-place upgrade installer failed with exit code $($upgrade.ExitCode)" }
          Write-Host "UPGRADE MARKER F: in-place installer returned"
          # The silent installer must restart the launcher/watchdog itself.
          # Do NOT manually start it here: this gate exists to catch the exact
          # production defect where skipifsilent left the updater dead.
          $healthy = $false
          for ($i=0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $h = Invoke-RestMethod -Uri "http://127.0.0.1:18787/health" -TimeoutSec 1
              $customerHealth = Invoke-RestMethod -Uri "http://127.0.0.1:48771/api/health" -TimeoutSec 1
              if ($h.ok -eq $true -and $h.callControl -eq $true -and $customerHealth.ok -eq $true) { $healthy = $true; break }
            } catch {}
          }
          if (-not $healthy) { throw "In-place upgrade did not restart complete local engine (18787 + 48771)" }
          # Health alone only proves the serving child is up. If the supervisor
          # (agent.exe --watchdog) died with the old copy, this machine loses
          # its agent the next time anything crashes — invisible to a probe.
          $agents = @(Get-Process agent -ErrorAction SilentlyContinue)
          if ($agents.Count -lt 2) {
            Write-Host "UPGRADE DIAGNOSTIC: expected supervisor + child, found $($agents.Count)"
            Get-CimInstance Win32_Process -Filter "Name='agent.exe'" -ErrorAction SilentlyContinue | Select-Object ProcessId,ParentProcessId,CommandLine | Format-List
            if (Test-Path $upgradeLog) { Write-Host "=== IN-PLACE INNO LOG TAIL ==="; Get-Content -LiteralPath $upgradeLog -Tail 160 }
            throw "In-place upgrade left $($agents.Count) agent process(es); supervisor did not survive the update"
          }
          if (Test-Path $upgradeLog) {
            $warn = Select-String -LiteralPath $upgradeLog -Pattern "WARNING . agent still not running" -SimpleMatch:$false -ErrorAction SilentlyContinue
            if ($warn) { throw "Installer could not re-establish supervision: $($warn.Line)" }
          }
          Write-Host "UPGRADE MARKER G: supervisor + child both alive"
          Get-Process agent -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Microsoft Defender security gate
        shell: powershell
        run: |
          $installer = Join-Path $PWD "build\\dist\\magic-dialer-engine-windows.exe"
          $mp = Join-Path $env:ProgramFiles "Windows Defender\\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { throw "Microsoft Defender CLI unavailable on release runner" }
          & $mp -SignatureUpdate
          & $mp -Scan -ScanType 3 -File $installer -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender flagged the installer; release blocked" }
          $agent = Join-Path $env:LOCALAPPDATA "Magic Dialer\\agent.exe"
          if (Test-Path $agent) {
            & $mp -Scan -ScanType 3 -File $agent -DisableRemediation
            if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender flagged agent.exe; release blocked" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: magic-dialer-engine-windows
          path: src/management/build/dist/magic-dialer-engine-windows.exe
          if-no-files-found: error
      - name: Verify updater rollback state gate
        shell: pwsh
        run: |
          node agent/auto-update.behavior.test.js
          if ($LASTEXITCODE -ne 0) { throw "Updater rollback behavior gate failed" }

      - name: Publish immutable installer and one-time legacy bridge
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Join-Path $PWD "build\\dist\\magic-dialer-engine-windows.exe"
          $version = "1.4.12"
          $tag = "engine-v$version"
          $assetUrl = "https://github.com/shomailasif/magic-dialer-final/releases/download/$tag/magic-dialer-engine-windows.exe"
          $sha = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $manifestPath = Join-Path $PWD "build\\dist\\engine-manifest.json"
          $manifest = @{ version = $version; sha256 = $sha; url = $assetUrl; tag = $tag; sourceCommit = $env:GITHUB_SHA } | ConvertTo-Json -Compress
          Set-Content -LiteralPath $manifestPath -Value $manifest -Encoding UTF8

          $ErrorActionPreference = "Continue"
          cmd /c "gh release view $tag --json tagName >nul 2>nul"
          $immutableExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"
          if ($immutableExists) {
            $releaseCommit = (gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" --jq '.target_commitish').Trim()
            if (-not $releaseCommit) { throw "Existing immutable release has no target commit" }
            git fetch origin $releaseCommit --depth=1
            git diff --quiet $releaseCommit $env:GITHUB_SHA -- src/management ':(glob,exclude)src/management/**/*.test.js' ':(glob,exclude)src/management/**/*.test.ts' ':(exclude)src/management/build/run-all-tests.ps1'
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Immutable release $tag already exists and engine sources are unchanged; preserving release and skipping republish."
              exit 0
            }
            throw "Engine sources changed after immutable $tag; bump engine version before publishing."
          }

          gh release create $tag $installer $manifestPath --target $env:GITHUB_SHA --title "Magic Dialer Engine $version" --notes "Immutable validated Windows engine $version. Source commit $env:GITHUB_SHA. SHA-256 $sha." --latest
          if ($LASTEXITCODE -ne 0) { throw "Immutable release publish failed" }

          # Legacy 1.3.9 updaters only trust engine-latest URLs. Bridge them once to
          # the exact same 1.4.0 installer bytes; 1.4.0+ uses immutable discovery.
          $legacyDir = Join-Path $env:RUNNER_TEMP "magic-dialer-legacy-bridge"
          New-Item -ItemType Directory -Force -Path $legacyDir | Out-Null
          $legacyManifest = Join-Path $legacyDir "engine-manifest.json"
          $legacyInstaller = Join-Path $legacyDir "magic-dialer-engine-windows.exe"
          Copy-Item -LiteralPath $installer -Destination $legacyInstaller -Force
          $legacyUrl = "https://github.com/shomailasif/magic-dialer-final/releases/download/engine-latest/magic-dialer-engine-windows.exe"
          @{ version = $version; sha256 = $sha; url = $legacyUrl } | ConvertTo-Json -Compress | Set-Content -LiteralPath $legacyManifest -Encoding UTF8

          gh release upload engine-latest $legacyInstaller $legacyManifest --clobber
          if ($LASTEXITCODE -ne 0) { throw "Legacy 1.3.9 migration bridge publish failed" }
