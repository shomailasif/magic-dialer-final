name: Build Windows Engine
on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "src/management/agent/**"
      - "src/management/build/**"
      - "src/management/package.json"
      - ".github/workflows/build-windows-engine.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install packaging tools
        run: npm install --no-save esbuild @yao-pkg/pkg
      - name: Bundle engine
        run: node build/bundle.js
      - name: Package engine
        shell: powershell
        run: npx pkg build/dist/agent-bundle.js --targets node22-win-x64 --output build/dist/agent.exe
      - name: Compile launcher
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build/compile-launcher.ps1
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss'
      - name: Silent installer smoke test
        shell: powershell
        run: |
          $installer = Join-Path $PWD "build\\dist\\magic-dialer-engine-windows.exe"
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA "Magic Dialer"))) { throw "Installer did not create application directory" }
          $app = Join-Path $env:LOCALAPPDATA "Magic Dialer"
          foreach ($file in @("agent.exe","MagicDialer.exe","logo.ico")) {
            if (-not (Test-Path (Join-Path $app $file))) { throw "Missing installed $file" }
          }
          $startup = Join-Path $env:APPDATA "Microsoft\\Windows\\Start Menu\\Programs\\Startup\\Magic Dialer.lnk"
          if (-not (Test-Path $startup)) { throw "Missing Windows startup shortcut" }
          $engine = Join-Path $app "agent.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "engine-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "engine-stderr.log"
          $proc = Start-Process -FilePath $engine -ArgumentList "--no-browser" -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $healthy = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18787/health" -TimeoutSec 1
                if ($health.ok -eq $true -and $health.service -eq "magic-dialer-engine") { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) {
              if (Test-Path $stdout) { Write-Host "ENGINE STDOUT:"; Get-Content $stdout }
              if (Test-Path $stderr) { Write-Host "ENGINE STDERR:"; Get-Content $stderr }
              if ($proc.HasExited) { Write-Host "ENGINE EXIT CODE: $($proc.ExitCode)" }
              throw "Installed engine did not become healthy on localhost:18787"
            }
          } finally {
            Get-Process agent -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          $uninstaller = Join-Path $app "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Missing uninstaller" }
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (Test-Path (Join-Path $app "agent.exe")) { throw "Engine remained after uninstall" }
      - uses: actions/upload-artifact@v4
        with:
          name: magic-dialer-engine-windows
          path: src/management/build/dist/magic-dialer-engine-windows.exe
          if-no-files-found: error
