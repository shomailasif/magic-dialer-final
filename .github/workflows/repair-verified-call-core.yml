name: Repair verified call core
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply verified repairs
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/lib/sip-conversation.ts')
          s=p.read_text()
          old='const b = Buffer.alloc(FRAME);'
          assert old in s
          s=s.replace(old,'const b = Buffer.alloc(FRAME, 0xff);',1)
          old='''  const greeting = getInitialGreeting(state);\n  const greetingFramesPromise = textToFramesLocal(greeting);\n  const callPromise = sipCallBridge(sipConfig);\n  const [call, greetingFrames] = await Promise.all([callPromise, greetingFramesPromise]);'''
          new='''  const greeting = getInitialGreeting(state);\n  // Prepare the opening completely before dialing: answer must never wait on TTS.\n  const greetingFrames = await textToFramesLocal(greeting);\n  const call = await sipCallBridge(sipConfig);'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify source invariants
        run: |
          grep -F 'Buffer.alloc(FRAME, 0xff)' src/lib/sip-conversation.ts
          grep -F 'const greetingFrames = await textToFramesLocal(greeting);' src/lib/sip-conversation.ts
          ! grep -F 'Promise.all([callPromise, greetingFramesPromise])' src/lib/sip-conversation.ts
      - run: npm ci
      - run: npm run build
      - name: Commit only after green build
        run: |
          git config user.name wodozone-repair
          git config user.email actions@users.noreply.github.com
          git add src/lib/sip-conversation.ts
          git diff --cached --exit-code && exit 0
          git commit -m 'Fix greeting latency and mu-law frame padding'
          git push
