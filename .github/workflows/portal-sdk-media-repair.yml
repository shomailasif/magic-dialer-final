name: Portal SDK Media Repair
on:
  push:
    branches: [build/local-call-engine-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/local-call-engine-v2
      - name: Surgically replace manual RingCentral RTP with SDK streamer
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/management/portal/trunk.js')
          s=p.read_text()
          s=s.replace('authId: String(settings.authId || user).trim(),','authId: String(settings.authId || settings.authorizationId || user).trim(),')
          start=s.index('          const cs = r.callSession;\n', s.index('async function dialViaRingCentral'))
          end=s.index('          cs.once("disposed", () => {', start)
          replacement='''          const cs = r.callSession;\n\n          cs.on("audioPacket", (rtpPacket) => {\n            try {\n              if (session.media && !session.media.ended) {\n                session.media.send(rtpPacket.payload, true);\n              }\n            } catch {}\n            session.mediaBytesIn = (session.mediaBytesIn || 0) + rtpPacket.payload.length;\n          });\n\n          session.agentAudioHandler = (audioBuffer) => {\n            if (cs.disposed || !audioBuffer || !audioBuffer.length) return;\n            try {\n              const streamer = cs.streamAudio(Buffer.from(audioBuffer));\n              session._activeStreamer = streamer;\n              streamer.once("finished", () => {\n                if (session._activeStreamer === streamer) session._activeStreamer = null;\n              });\n              session.mediaBytesOut = (session.mediaBytesOut || 0) + audioBuffer.length;\n            } catch (e) {\n              session.audioError = (e && e.message) || String(e);\n            }\n          };\n\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
      - name: Verify repair
        run: |
          node --check src/management/portal/trunk.js
          grep -q 'cs.streamAudio(Buffer.from(audioBuffer))' src/management/portal/trunk.js
          ! grep -q 'werift_rtp' src/management/portal/trunk.js
          ! grep -q 'srtpSession.encrypt' src/management/portal/trunk.js
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/management/portal/trunk.js
          git commit -m 'Use RingCentral SDK streamer for production media'
          git push origin HEAD:build/local-call-engine-v2
